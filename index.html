<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>哆啦A夢風格活動報告 - AI智慧圖說生成器</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- PDF Generation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&family=Varela+Round&display=swap');
        
        body {
            font-family: 'Varela Round', 'Noto Sans TC', sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 0;
            color: #1f2937;
        }

        /* A4 Paper Simulation */
        .a4-page {
            width: 210mm;
            height: 297mm;
            margin: 0 auto;
            background: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12), 0 2px 8px rgba(0, 0, 0, 0.06);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            transform-origin: top center;
        }

        /* Print Settings */
        @media print {
            body { 
                background: white !important; 
                margin: 0 !important;
                padding: 0 !important;
            }
            .no-print { 
                display: none !important; 
            }
            .a4-page {
                box-shadow: none !important;
                margin: 0 !important;
                width: 210mm !important;
                height: 297mm !important;
                page-break-after: always;
                transform: none !important;
            }
            @page {
                size: A4 portrait;
                margin: 0;
            }
        }

        /* Custom Input Styling */
        .seamless-input {
            background: transparent;
            border: none;
            outline: none;
            text-align: left;
            width: 100%;
        }
        .seamless-input::placeholder {
            color: #9ca3af;
            opacity: 0.6;
        }

        /* 標楷體字型設定 */
        .font-kaiti {
            font-family: 'DFKai-SB', 'BiauKai', 'TW-Kai', '楷體', 'KaiTi', 'Noto Serif TC', serif !important;
        }

        /* Lucky Shape Background Pattern */
        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.15;
            overflow: hidden;
        }
        .shape { 
            position: absolute; 
        }

        /* Single line text with ellipsis */
        .single-line-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: clip; 
            letter-spacing: 1px;
        }

        /* Doraemon Bell Style */
        .bell-icon {
            border: 2px solid #000;
            border-radius: 50%;
            position: relative;
        }
        .bell-line {
            background: #000;
            height: 2px;
            width: 100%;
            position: absolute;
            top: 40%;
        }
        .bell-hole {
            background: #000;
            width: 20%;
            height: 20%;
            border-radius: 50%;
            position: absolute;
            bottom: 20%;
            left: 40%;
        }
        .bell-vertical {
            background: #000;
            width: 2px;
            height: 25%;
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }
        
        /* Animation for Settings Panel */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .settings-panel-enter {
            animation: slideIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Custom Scrollbar for Panel */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // Custom SVGs for shapes
        const Clover = ({ size, color, style }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill={color} style={style} className="shape">
                <path d="M12 2C9 2 7 5 7 7C7 5 4 3 2 4C0 5 0 8 2 10L6 12L2 14C0 16 0 19 2 20C4 21 7 19 7 17C7 19 9 22 12 22C15 22 17 19 17 17C17 19 20 21 22 20C24 19 24 16 22 14L18 12L22 10C24 8 24 5 22 4C20 3 17 5 17 7C17 5 15 2 12 2Z" />
            </svg>
        );

        const Star = ({ size, color, style }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill={color} style={style} className="shape">
                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            </svg>
        );

        const Dorayaki = ({ size, color, style }) => (
            <svg width={size} height={size * 0.75} viewBox="0 0 100 75" fill={color} style={style} className="shape">
                <path d="M10,35 C10,10 30,5 50,5 C70,5 90,10 90,35 Z" />
                <path d="M10,40 C10,65 30,70 50,70 C70,70 90,65 90,40 Z" />
                <rect x="15" y="36" width="70" height="4" rx="2" fillOpacity="0.6"/>
            </svg>
        );

        // Toast Component
        const Toast = ({ message, type, onClose }) => {
            if (!message) return null;
            const bgClass = type === 'error' ? 'bg-red-500 text-white' : 
                            type === 'success' ? 'bg-emerald-600 text-white' : 
                            type === 'warning' ? 'bg-amber-500 text-white' : 
                            'bg-slate-800 text-white';
            return (
                <div className={`fixed top-4 left-1/2 transform -translate-x-1/2 z-[100] px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 transition-all duration-300 font-medium text-sm no-print ${bgClass}`}>
                    <span>{message}</span>
                    <button onClick={onClose} className="opacity-80 hover:opacity-100 text-lg leading-none ml-2">&times;</button>
                </div>
            );
        };

        // 內建預設 API Key (透過 base64 編碼避免 GitHub Push Protection 阻擋)
        const DEFAULT_API_KEY = atob("QVEuQWI4Uk42Sk15MG00ajY1TjRrX2VJMGxRSzRDSTZweW04QkdEM1hKRHUxcW9HTTYxSkE=");

        const App = () => {
            // Theme State
            const [mainColor, setMainColor] = useState('#0096E1'); // Doraemon Blue
            const [secondaryColor, setSecondaryColor] = useState('#EF4444'); // Red
            const [bellColor, setBellColor] = useState('#FACC15'); // Bell Color
            const [title, setTitle] = useState('快樂學習活動報告');
            const [date, setDate] = useState('2026 年 11 月 07 日');
            
            // UI State
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [isGenerating, setIsGenerating] = useState({});
            const [isExporting, setIsExporting] = useState(false);
            const [exportStatusText, setExportStatusText] = useState('');
            const [photoCount, setPhotoCount] = useState(6);
            const [toast, setToast] = useState({ message: '', type: 'info' });
            const [viewScale, setViewScale] = useState(1);
            const [showApiKey, setShowApiKey] = useState(false);
            const [isTestingApi, setIsTestingApi] = useState(false);
            const [dragOverId, setDragOverId] = useState(null);

            // API Settings (Stored in LocalStorage or Embedded Default or URL)
            const [apiKey, setApiKey] = useState(() => {
                const urlKey = new URLSearchParams(window.location.search).get('key');
                if (urlKey) {
                    localStorage.setItem('gemini_api_key', urlKey.trim());
                    return urlKey.trim();
                }
                const saved = localStorage.getItem('gemini_api_key');
                // 若本機儲存的是舊版截斷的 Key (結尾是 BGD3)，自動修正為完整的 DEFAULT_API_KEY
                if (saved && saved.endsWith('BGD3') && DEFAULT_API_KEY) {
                    localStorage.setItem('gemini_api_key', DEFAULT_API_KEY);
                    return DEFAULT_API_KEY;
                }
                return saved || DEFAULT_API_KEY || '';
            });
            const [selectedModel, setSelectedModel] = useState(() => {
                const saved = localStorage.getItem('gemini_model');
                // 自動將舊版或過載模型升級為實測最穩定的 gemini-3.6-flash
                if (!saved || saved.includes('2.0') || saved.includes('1.5') || saved.includes('2.5') || saved === 'gemini-3.8-flash') {
                    localStorage.setItem('gemini_model', 'gemini-3.6-flash');
                    return 'gemini-3.6-flash';
                }
                return saved;
            });
            const [customModelInput, setCustomModelInput] = useState(() => localStorage.getItem('gemini_custom_model') || '');
            const [promptStyle, setPromptStyle] = useState('warm'); // warm, energetic, exploratory, custom
            const [customPrompt, setCustomPrompt] = useState(() => 
                localStorage.getItem('gemini_custom_prompt') || 
                "請「根據這張照片的具體內容與細節」，用繁體中文為這張照片寫一句簡短的說明。風格要溫馨、可愛、快樂，適合放在小學生的活動紀錄中。嚴格限制包含標點符號在 18 個中文字以內。結尾必須是句號。"
            );
            
            // 6 Grid Items
            const [items, setItems] = useState([
                { id: 1, image: null, caption: '第一次動手做實驗真有趣。' },
                { id: 2, image: null, caption: '大家一起合力完成拼圖喔。' },
                { id: 3, image: null, caption: '戶外教學看到了好多小花。' },
                { id: 4, image: null, caption: '老師教我們畫畫好開心呀。' },
                { id: 5, image: null, caption: '美味的午餐大家都吃光光。' },
                { id: 6, image: null, caption: '放學排隊回家要注意安全。' },
            ]);

            const fileInputRefs = useRef({});
            const batchFileInputRef = useRef(null);
            const pageRef = useRef(null);

            // Toast helper
            const showToast = (message, type = 'info', duration = 3500) => {
                setToast({ message, type });
                setTimeout(() => {
                    setToast(prev => prev.message === message ? { message: '', type: 'info' } : prev);
                }, duration);
            };

            // Handle URL Key Auto-clean
            useEffect(() => {
                if (new URLSearchParams(window.location.search).has('key')) {
                    showToast('🎉 已成功自動載入並儲存 API Key！', 'success', 4000);
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            }, []);

            // Save settings to LocalStorage
            useEffect(() => {
                localStorage.setItem('gemini_api_key', apiKey);
            }, [apiKey]);

            useEffect(() => {
                localStorage.setItem('gemini_model', selectedModel);
            }, [selectedModel]);

            useEffect(() => {
                localStorage.setItem('gemini_custom_prompt', customPrompt);
            }, [customPrompt]);

            // Handle Prompt Style Switch
            const handlePromptStyleChange = (style) => {
                setPromptStyle(style);
                if (style === 'warm') {
                    setCustomPrompt("請「根據這張照片的具體內容與細節」，用繁體中文為這張照片寫一句簡短的說明。風格要溫馨、可愛、快樂，適合放在小學生的活動紀錄中。嚴格限制包含標點符號在 18 個中文字以內。結尾必須是句號。");
                } else if (style === 'energetic') {
                    setCustomPrompt("請「根據這張照片的生動瞬間」，用繁體中文寫一句充滿熱情、活力四射的小朋友活動圖說。嚴格限制包含標點符號在 18 個中文字以內。結尾必須是驚嘆號或句號。");
                } else if (style === 'exploratory') {
                    setCustomPrompt("請「觀察這張照片中的細節與探究過程」，用繁體中文寫一句專注探索、發現新知識的觀察筆記圖說。嚴格限制包含標點符號在 18 個中文字以內。結尾必須是句號。");
                }
            };

            // Test Gemini API Connection (Ultra-fast GET check with 6s timeout)
            const testApiConnection = async () => {
                const key = apiKey.trim();
                if (!key) {
                    showToast('請先輸入 Gemini API Key', 'warning');
                    return;
                }
                const activeModel = selectedModel === 'custom' ? (customModelInput.trim() || 'gemini-3.6-flash') : selectedModel;
                setIsTestingApi(true);

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 6000); // 6秒超時保護

                try {
                    // 使用 GET 查詢模型元資料，速度小於 0.2 秒且不需排隊生成文字
                    const response = await fetch(
                        `https://generativelanguage.googleapis.com/v1beta/models/${activeModel}?key=${key}`,
                        {
                            method: 'GET',
                            signal: controller.signal
                        }
                    );
                    clearTimeout(timeoutId);
                    const resJson = await response.json();

                    if (response.ok && resJson?.name) {
                        showToast(`🎉 連線成功！Gemini (${activeModel}) 驗證通過，可正常使用！`, 'success', 5000);
                    } else {
                        const errMsg = resJson?.error?.message || response.statusText || '未知錯誤';
                        const match = errMsg.match(/models\/(gemini-[0-9.]+-[a-zA-Z0-9]+)/);
                        if (match && match[1]) {
                            const newModel = match[1];
                            setSelectedModel(newModel);
                            localStorage.setItem('gemini_model', newModel);
                            showToast(`💡 Google 提示請改用 ${newModel}，已自動切換！請再按一次測試`, 'info', 6000);
                        } else {
                            showToast(`❌ 連線失敗 (${response.status})：${errMsg}`, 'error', 6000);
                        }
                    }
                } catch (err) {
                    clearTimeout(timeoutId);
                    console.error('API Test Error:', err);
                    if (err.name === 'AbortError') {
                        showToast('⚠️ 連線逾時（超過 6 秒未回應）。可能是校園學術網路或防毒軟體阻擋了 Google API 連線。', 'error', 7000);
                    } else {
                        showToast('❌ 網路請求失敗，請檢查網路連線或是否開啟了廣告阻擋外掛', 'error', 6000);
                    }
                } finally {
                    setIsTestingApi(false);
                }
            };

            // AI Caption Generator with Model Fallback & 429 Rate Limit Backoff
            const generateAICaption = async (base64Data, mimeType) => {
                const key = apiKey.trim();
                if (!key) {
                    showToast('💡 尚未設定 API Key，可至右上角「設定工具箱」輸入開啟 AI 圖說！', 'info', 4500);
                    return null;
                }

                const prompt = customPrompt || "請「根據這張照片的具體內容與細節」，用繁體中文為這張照片寫一句簡短的說明。風格要溫馨、可愛、快樂，適合放在小學生的活動紀錄中。嚴格限制包含標點符號在 18 個中文字以內。結尾必須是句號。";
                
                const activeModel = selectedModel === 'custom' ? (customModelInput.trim() || 'gemini-3.6-flash') : selectedModel;
                
                // Models fallback order (gemini-3.6-flash 實測速度最快且最穩定)
                const candidateModels = [activeModel, 'gemini-3.6-flash', 'gemini-3.5-flash', 'gemini-3.8-flash'];
                const modelsToTry = [...new Set(candidateModels)];

                for (let i = 0; i < modelsToTry.length; i++) {
                    const model = modelsToTry[i];

                    // 429 頻率限制重試迴圈 (最多重試 2 次)
                    for (let attempt = 0; attempt < 2; attempt++) {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 12000); // 單次嘗試最多等 12 秒

                        try {
                            const response = await fetch(
                                `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`,
                                {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    signal: controller.signal,
                                    body: JSON.stringify({
                                        contents: [{
                                            parts: [
                                                { text: prompt },
                                                { inlineData: { mimeType: mimeType || 'image/jpeg', data: base64Data } }
                                            ]
                                        }]
                                    })
                                }
                            );
                            clearTimeout(timeoutId);

                            if (response.status === 429) {
                                console.warn(`Model ${model} hit 429 Rate Limit. Waiting 2.5s before retry...`);
                                await new Promise(r => setTimeout(r, 2500));
                                continue;
                            }

                            if (!response.ok) {
                                const errData = await response.json().catch(() => ({}));
                                console.warn(`Model ${model} request returned ${response.status}`, errData);
                                const errMsg = errData?.error?.message || '';
                                const match = errMsg.match(/models\/(gemini-[0-9.]+-[a-zA-Z0-9]+)/);
                                if (match && match[1] && !modelsToTry.includes(match[1])) {
                                    modelsToTry.push(match[1]);
                                }
                                break; // 跳出此模型的重試，換下一個候選模型
                            }

                            const data = await response.json();
                            let text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                            text = text.trim().replace(/[\r\n]+/g, '');
                            if (text.length > 18) {
                                text = text.substring(0, 17) + "。";
                            }
                            if (text) {
                                if (model !== activeModel && selectedModel !== 'custom') {
                                    setSelectedModel(model);
                                    localStorage.setItem('gemini_model', model);
                                }
                                return text;
                            }
                        } catch (error) {
                            clearTimeout(timeoutId);
                            if (error.name === 'AbortError') {
                                console.warn(`Model ${model} timed out after 12s, trying next model...`);
                            } else {
                                console.error(`AI Generation attempt with ${model} failed`, error);
                            }
                            break;
                        }
                    }
                }
                
                showToast('AI 分析未取得結果，請檢查 API Key 或額度與網路連線', 'warning', 5000);
                return null;
            };

            // Process image file
            const processImageFile = (id, file) => {
                if (!file || !file.type.startsWith('image/')) {
                    showToast('請上傳有效的圖檔格式 (JPG, PNG, WEBP 等)', 'warning');
                    return Promise.resolve();
                }
                
                setIsGenerating(prev => ({ ...prev, [id]: true }));
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        const result = e.target.result;
                        setItems(prev => prev.map(item => 
                            item.id === id ? { ...item, image: result, caption: apiKey ? "AI 正在看圖說故事..." : item.caption } : item
                        ));
                        
                        if (apiKey) {
                            try {
                                const base64Data = result.split(',')[1];
                                const aiCaption = await generateAICaption(base64Data, file.type);
                                if (aiCaption) {
                                    setItems(prev => prev.map(item => item.id === id ? { ...item, caption: aiCaption } : item));
                                    showToast(`第 ${id} 格 AI 圖說生成成功！`, 'success');
                                }
                            } catch (err) {
                                console.error(err);
                            } finally {
                                setIsGenerating(prev => ({ ...prev, [id]: false }));
                                resolve();
                            }
                        } else {
                            setIsGenerating(prev => ({ ...prev, [id]: false }));
                            resolve();
                        }
                    };
                    reader.readAsDataURL(file);
                });
            };

            const handleImageUpload = (id, e) => {
                const file = e.target.files[0];
                if (file) {
                    processImageFile(id, file);
                }
            };

            // Batch upload (依序處理避免超過 Google API 頻率限制)
            const handleBatchUpload = async (e) => {
                const files = Array.from(e.target.files || []);
                if (files.length === 0) return;
                
                const count = Math.min(files.length, photoCount);
                showToast(`正在依序為 ${count} 張照片分析並生成圖說...`, 'info', 3500);
                for (let i = 0; i < count; i++) {
                    const targetId = items[i].id;
                    await processImageFile(targetId, files[i]);
                    if (i < count - 1) {
                        await new Promise(r => setTimeout(r, 1200));
                    }
                }
                showToast(`🎉 全部 ${count} 張照片已處理完畢！`, 'success', 4000);
                // Reset file input
                if (batchFileInputRef.current) batchFileInputRef.current.value = '';
            };

            // Drag and drop handlers
            const handleDragOver = (id, e) => {
                e.preventDefault();
                e.stopPropagation();
                setDragOverId(id);
            };

            const handleDragLeave = (id, e) => {
                e.preventDefault();
                e.stopPropagation();
                if (dragOverId === id) setDragOverId(null);
            };

            const handleDrop = (id, e) => {
                e.preventDefault();
                e.stopPropagation();
                setDragOverId(null);
                const file = e.dataTransfer.files?.[0];
                if (file) {
                    processImageFile(id, file);
                }
            };

            // Remove image from item
            const handleRemoveImage = (id, e) => {
                e.stopPropagation();
                setItems(prev => prev.map(item => 
                    item.id === id ? { ...item, image: null } : item
                ));
                showToast(`已清除第 ${id} 格照片`, 'info');
            };

            // Regenerate AI Caption
            const regenerateCaption = async (id) => {
                const item = items.find(i => i.id === id);
                if (!item || !item.image) return;
                if (!apiKey.trim()) {
                    showToast('請先於右上角設定工具箱輸入 Gemini API Key', 'warning');
                    setIsSettingsOpen(true);
                    return;
                }
                
                setIsGenerating(prev => ({ ...prev, [id]: true }));
                setItems(prev => prev.map(i => i.id === id ? { ...i, caption: "AI 重新思考中..." } : i));
                try {
                    const [metadata, base64Data] = item.image.split(',');
                    const mimeType = metadata.split(':')[1].split(';')[0];
                    const aiCaption = await generateAICaption(base64Data, mimeType);
                    if (aiCaption) {
                        setItems(prev => prev.map(i => i.id === id ? { ...i, caption: aiCaption } : item));
                        showToast(`第 ${id} 格圖說更新完成！`, 'success');
                    } else {
                        setItems(prev => prev.map(i => i.id === id ? { ...i, caption: "照片真好看！" } : i));
                    }
                } catch (err) {
                    console.error(err);
                    showToast("重新分析失敗，請檢查網路連線", "error");
                } finally {
                    setIsGenerating(prev => ({ ...prev, [id]: false }));
                }
            };

            // Regenerate all captions
            const regenerateAllCaptions = async () => {
                if (!apiKey.trim()) {
                    showToast('請先於右上角設定工具箱輸入 Gemini API Key', 'warning');
                    setIsSettingsOpen(true);
                    return;
                }
                const activeItems = items.slice(0, photoCount).filter(item => item.image);
                if (activeItems.length === 0) {
                    showToast('尚未上傳任何照片，請先上傳照片', 'warning');
                    return;
                }
                showToast(`開始全自動依序為 ${activeItems.length} 張照片生成圖說...`, 'info', 3500);
                for (let i = 0; i < activeItems.length; i++) {
                    await regenerateCaption(activeItems[i].id);
                    if (i < activeItems.length - 1) {
                        await new Promise(r => setTimeout(r, 1200));
                    }
                }
                showToast('所有照片圖說生成完畢！', 'success');
            };

            const handleCaptionChange = (id, text) => {
                if (text.length <= 18) {
                    const newItems = items.map(item => 
                        item.id === id ? { ...item, caption: text } : item
                    );
                    setItems(newItems);
                }
            };

            const triggerFileInput = (id) => {
                if (fileInputRefs.current[id]) {
                    fileInputRefs.current[id].click();
                }
            };

            // Enhanced Generate Canvas Data
            const getCanvasData = async () => {
                const element = pageRef.current;
                return await html2canvas(element, { 
                    scale: 2, 
                    useCORS: true, 
                    logging: false,
                    backgroundColor: '#ffffff'
                });
            };

            // Full-bleed A4 PDF Download
            const downloadPDF = async () => {
                setIsExporting(true);
                setExportStatusText('正在生成超高解析度 PDF...');
                try {
                    const canvas = await getCanvasData();
                    const imgData = canvas.toDataURL('image/jpeg', 1.0);
                    const pdf = new jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = pdf.internal.pageSize.getHeight();
                    pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
                    pdf.save(`${title || '活動報告'}.pdf`);
                    showToast('✅ PDF 下載完成！', 'success');
                } catch (err) {
                    console.error(err);
                    showToast("PDF 下載失敗，請重試", 'error');
                } finally {
                    setIsExporting(false);
                    setExportStatusText('');
                }
            };

            // Full-bleed A4 Word Download
            const downloadWord = async () => {
                setIsExporting(true);
                setExportStatusText('正在封裝 Word (.doc) 檔案...');
                try {
                    const canvas = await getCanvasData();
                    const imgData = canvas.toDataURL('image/jpeg', 1.0);
                    
                    const wordHTML = `
                    <html xmlns:o="urn:schemas-microsoft-com:office:office"
                          xmlns:w="urn:schemas-microsoft-com:office:word"
                          xmlns="http://www.w3.org/TR/REC-html40">
                    <head>
                        <meta charset="utf-8">
                        <title>${title}</title>
                        <!--[if gte mso 9]>
                        <xml>
                            <w:WordDocument>
                                <w:View>Print</w:View>
                                <w:Zoom>100</w:Zoom>
                                <w:DoNotOptimizeForBrowser/>
                            </w:WordDocument>
                        </xml>
                        <![endif]-->
                        <style>
                            @page WordSection1 {
                                size: 21cm 29.7cm;
                                margin: 0cm;

                                mso-footer-margin: 0cm;
                                mso-paper-source: 0;
                            }
                            div.WordSection1 { page: WordSection1; margin: 0; padding: 0; }
                            body { margin: 0; padding: 0; }
                        </style>
                    </head>
                    <body>
                        <div class="WordSection1">
                            <img src="${imgData}" width="794" height="1123" style="width: 21cm; height: 29.7cm; display: block; margin: 0; padding: 0; border: none;" />
                        </div>
                    </body>
                    </html>
                    `;
                    const blob = new Blob(['\ufeff', wordHTML], { type: 'application/msword' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `${title || '活動報告'}.doc`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                    showToast('✅ Word 下載完成！', 'success');
                } catch (err) {
                    console.error(err);
                    showToast("Word 下載失敗，請重試", 'error');
                } finally {
                    setIsExporting(false);
                    setExportStatusText('');
                }
            };

                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    showToast('✅ 圖片下載完成！', 'success');

                };

                    { id: 2, image: createDemoSvg('創意積木合作', '🧩', '#f43f5e', '#be123c'), caption: '大家一起合力完成拼圖喔。' },
                    { id: 3, image: createDemoSvg('校園生態自然觀察', '🌻', '#34d399', '#059669'), caption: '戶外教學看到了好多小花。' },

                    { id: 5, image: createDemoSvg('美味營養午餐時刻', '🍱', '#a855f7', '#7e22ce'), caption: '美味的午餐大家都吃光光。' },
                    { id: 6, image: createDemoSvg('快樂排隊安全放學', '🎒', '#ec4899', '#be185d'), caption: '放學排隊回家要注意安全。' },

                        { id: 3, image: null, caption: '戶外教學看到了好多小花。' },

                        )}
                    </button>

                    {/* Settings Panel Drawer */}
                    {isSettingsOpen && (

                                        <option value={3}>3 張 (上1下2)</option>
                                        <option value={4}>4 張 (田字格排列)</option>
                                        <option value={6}>6 張 (預設經典六格)</option>
                                    </select>
                                </div>

                                {/* Activity Date */}
                                <div>
                                    <label className="text-xs font-bold text-gray-700 block mb-1">活動日期 (選填)</label>
                                    <input 
                                        type="text" 
                                        value={date}
                                        onChange={(e) => setDate(e.target.value)}
                                        className="w-full border border-gray-300 rounded-lg px-2.5 py-1.5 text-xs focus:outline-none focus:border-blue-500"
                                        placeholder="例如：2026 年 11 月 07 日"
                                    />
                                    <p className="text-[10px] text-gray-400 mt-0.5">留空則不顯示右上方日期標籤</p>
                                </div>
                            </div>

                            {/* Section 3: Quick Utilities */}
                            <div className="mt-5 pt-4 border-t border-gray-200 space-y-2">
                                <label className="text-xs font-bold text-gray-700 block">快捷操作工具</label>
                                <div className="grid grid-cols-2 gap-2">
                                    <button
                                        onClick={() => batchFileInputRef.current && batchFileInputRef.current.click()}
                                        className="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 py-1.5 px-2 rounded-lg font-bold text-xs flex items-center justify-center gap-1 transition-all"
                                    >
                                        <span>📷</span> 批次選圖
                                    </button>
                                    <button
                                        onClick={loadDemoData}
                                        className="bg-purple-50 hover:bg-purple-100 text-purple-700 border border-purple-200 py-1.5 px-2 rounded-lg font-bold text-xs flex items-center justify-center gap-1 transition-all"
                                    >
                                        <span>✨</span> 載入示範
                                    </button>
                                </div>
                                <button
                                    onClick={clearAllData}
                                    className="w-full bg-gray-50 hover:bg-red-50 text-gray-500 hover:text-red-600 border border-gray-200 py-1 rounded-lg text-[11px] font-medium transition-colors"
                                >
                                    🗑️ 重設清空所有圖片
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Always Visible Floating Export Bar */}
                    <div className="no-print fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-white/95 backdrop-blur-md px-5 py-2.5 rounded-full shadow-[0_10px_35px_rgba(0,0,0,0.18)] border border-gray-200 z-[60] flex items-center gap-3 transition-all">
                        <span className="text-xs font-bold text-gray-700 hidden md:block mr-1 tracking-wider">
                            匯出報告：
                        </span>

                        {/* PDF Download */}
                        <button
                            onClick={downloadPDF}
                            disabled={isExporting}
                            className="bg-blue-500 hover:bg-blue-600 active:scale-95 text-white font-bold py-2 px-4 rounded-full flex items-center justify-center gap-1.5 text-xs sm:text-sm transition-all shadow-md hover:shadow-lg disabled:opacity-50"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            下載 PDF
                        </button>
                        
                        {/* Word Download */}
                        <button
                            onClick={downloadWord}
                            disabled={isExporting}
                            className="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold py-2 px-4 rounded-full flex items-center justify-center gap-1.5 text-xs sm:text-sm transition-all shadow-md hover:shadow-lg disabled:opacity-50"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 22h14a2 2 0 0 0 2-2V7.5L14.5 2H6a2 2 0 0 0-2 2v4"/><polyline points="14 2 14 8 20 8"/><path d="M2 15h10"/><path d="m9 18 3-3-3-3"/></svg>
                            下載 Word
                        </button>

                        {/* PNG Download */}
                        <button
                            onClick={downloadImage}
                            disabled={isExporting}
                            className="bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold py-2 px-4 rounded-full flex items-center justify-center gap-1.5 text-xs sm:text-sm transition-all shadow-md hover:shadow-lg disabled:opacity-50 hidden sm:flex"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                            下載圖片
                        </button>

                        {/* Print */}
                        <button
                            onClick={handlePrint}
                            className="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2 px-3.5 rounded-full flex items-center justify-center gap-1.5 text-xs sm:text-sm transition-all border border-gray-300"
                            title="直接呼叫瀏覽器列印 (Ctrl+P)"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                            列印
                        </button>
                    </div>

                    {/* Scale Container */}
                    <div style={{ transform: `scale(${viewScale})`, transformOrigin: 'top center', transition: 'transform 0.2s ease' }}>
                        {/* A4 Page Render Area */}
                        <div ref={pageRef} className="a4-page border-4 box-border relative" style={{ borderColor: mainColor }}>
                            
                            {/* Background Decor */}
                            <div className="bg-pattern">
                                <Clover size={180} color={mainColor} style={{ top: '2%', left: '-5%', opacity: 0.1, transform: 'rotate(15deg)' }} />
                                <Dorayaki size={160} color={secondaryColor} style={{ top: '5%', right: '-5%', opacity: 0.1, transform: 'rotate(-10deg)' }} />
                                <Star size={120} color="#FACC15" style={{ top: '40%', left: '2%', opacity: 0.15, transform: 'rotate(25deg)' }} />
                                <Clover size={200} color={secondaryColor} style={{ top: '55%', left: '35%', opacity: 0.05, transform: 'rotate(-5deg)' }} />
                                <Star size={150} color={mainColor} style={{ bottom: '15%', right: '0%', opacity: 0.1, transform: 'rotate(-15deg)' }} />
                                <Dorayaki size={180} color={mainColor} style={{ bottom: '-2%', left: '10%', opacity: 0.08, transform: 'rotate(10deg)' }} />
                            </div>

                            {/* Content Container */}
                            <div className="relative z-10 w-full h-full flex flex-col p-6">
                                
                                {/* Header */}
                                <div className="w-full flex justify-between items-center mb-4 border-b-4 border-dashed pb-2" style={{ borderColor: mainColor }}>
                                    <div className="flex items-center gap-3">
                                        <div className="w-12 h-12 bell-icon shadow-md flex-shrink-0" style={{ backgroundColor: bellColor }}>
                                            <div className="bell-line"></div>
                                            <div className="bell-hole"></div>
                                            <div className="bell-vertical"></div>
                                        </div>
                                        <div className="flex flex-col">
                                            <input 
                                                value={title}
                                                onChange={(e) => setTitle(e.target.value)}
                                                className="seamless-input text-left text-3xl font-black tracking-wider font-kaiti focus:ring-1 focus:ring-blue-300 rounded px-1"
                                                style={{ color: mainColor }}
                                                placeholder="輸入活動報告標題..."
                                            />
                                            {/* Rainbow Underline: Title Length + 8 */}
                                            <div className="flex items-center gap-1 mt-1 flex-wrap transition-all duration-300" style={{ minHeight: '8px' }}>
                                                {Array.from({ length: Math.max(1, (title || '').length + 8) }).map((_, i) => {
                                                    const rainbowColors = ['#EF4444', '#F97316', '#FACC15', '#10B981', '#3B82F6', '#6366F1', '#8B5CF6'];
                                                    return (
                                                        <div 
                                                            key={i} 
                                                            className="h-2 rounded-full transition-all duration-300"
                                                            style={{ 
                                                                width: i === 0 ? '24px' : '12px',
                                                                backgroundColor: rainbowColors[i % 7] 
                                                            }}
                                                        ></div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                    {date && (
                                        <div className="bg-white px-4 py-2 rounded-full border-2 shadow-sm flex-shrink-0" style={{ borderColor: secondaryColor }}>
                                            <input
                                                type="text"
                                                value={date}
                                                onChange={(e) => setDate(e.target.value)}
                                                className="seamless-input font-bold text-gray-600 text-center font-kaiti w-auto"
                                                style={{ minWidth: '130px' }}
                                                placeholder="日期..."
                                            />
                                        </div>
                                    )}
                                </div>

                                {/* Dynamic Grid */}
                                <div className={`flex-grow grid gap-6 ${
                                    photoCount === 1 ? 'grid-cols-1 grid-rows-1' :
                                    photoCount === 2 ? 'grid-cols-1 grid-rows-2' :
                                    photoCount === 3 ? 'grid-cols-2 grid-rows-2' :
                                    photoCount === 4 ? 'grid-cols-2 grid-rows-2' :
                                    'grid-cols-2 grid-rows-3'
                                }`}>
                                    {items.slice(0, photoCount).map((item, index) => (
                                        <div 
                                            key={item.id} 
                                            onDragOver={(e) => handleDragOver(item.id, e)}
                                            onDragLeave={(e) => handleDragLeave(item.id, e)}
                                            onDrop={(e) => handleDrop(item.id, e)}
                                            className={`flex flex-col h-full bg-white rounded-2xl overflow-hidden shadow-sm border-2 relative transition-all ${
                                                photoCount === 3 && index === 0 ? 'col-span-2' : ''
                                            } ${dragOverId === item.id ? 'ring-4 ring-blue-400 scale-[1.01]' : ''}`} 
                                            style={{ borderColor: dragOverId === item.id ? '#3B82F6' : mainColor }}
                                        >
                                            {/* Corner Lucky Icon */}
                                            <div className="absolute top-2 right-2 z-20 pointer-events-none opacity-50">
                                                {item.id % 3 === 0 ? <Star size={24} color="#FACC15"/> : 
                                                 item.id % 2 === 0 ? <Dorayaki size={24} color={secondaryColor}/> : 
                                                 <Clover size={24} color={mainColor}/>}
                                            </div>

                                            {/* Photo Box */}
                                            <div 
                                                className="flex-grow bg-gray-50 relative group cursor-pointer transition-colors hover:bg-gray-100 flex items-center justify-center overflow-hidden"
                                                onClick={() => triggerFileInput(item.id)}
                                            >
                                                <input
                                                    type="file"
                                                    accept="image/*"
                                                    className="hidden"
                                                    ref={el => fileInputRefs.current[item.id] = el}
                                                    onChange={(e) => handleImageUpload(item.id, e)}
                                                />
                                                
                                                {item.image ? (
                                                    <>
                                                        <img 
                                                            src={item.image} 
                                                            alt={`活動照片 ${item.id}`} 
                                                            className="w-full h-full object-cover absolute top-0 left-0" 
                                                        />
                                                        {/* Hover Controls */}
                                                        <div className="no-print absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-3 z-30">
                                                            <button
                                                                onClick={(e) => { e.stopPropagation(); triggerFileInput(item.id); }}
                                                                className="bg-white/90 hover:bg-white text-gray-800 font-bold px-3 py-1.5 rounded-full text-xs shadow-md transition-transform hover:scale-105 flex items-center gap-1"
                                                            >
                                                                🔄 更換
                                                            </button>
                                                            <button
                                                                onClick={(e) => handleRemoveImage(item.id, e)}
                                                                className="bg-red-500/90 hover:bg-red-600 text-white font-bold px-3 py-1.5 rounded-full text-xs shadow-md transition-transform hover:scale-105 flex items-center gap-1"
                                                            >
                                                                🗑️ 刪除
                                                            </button>
                                                        </div>
                                                    </>
                                                ) : (
                                                    <div className="w-full h-full flex flex-col items-center justify-center text-gray-400 p-4 select-none">
                                                        <div className="w-16 h-16 rounded-full bg-white flex items-center justify-center mb-2 shadow-sm border border-gray-200 group-hover:scale-110 transition-transform">
                                                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{color: mainColor}}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                                                        </div>
                                                        <span className="text-sm font-bold text-gray-500">點擊或拖曳照片 {item.id}</span>
                                                        <span className="text-[11px] text-gray-400 mt-1">支援 JPG / PNG / WEBP</span>
                                                    </div>
                                                )}
                                            </div>

                                            {/* Caption Box */}
                                            <div className="h-14 flex items-center justify-center px-3 relative" style={{ backgroundColor: '#fff', borderTop: `2px dashed ${mainColor}40` }}>
                                                <input 
                                                    value={item.caption}
                                                    onChange={(e) => handleCaptionChange(item.id, e.target.value)}
                                                    className={`seamless-input font-bold text-lg tracking-widest single-line-text pl-2 pr-10 font-kaiti ${
                                                        isGenerating[item.id] ? 'animate-pulse text-blue-500' : 'text-gray-700'
                                                    }`}
                                                    style={{ transition: 'color 0.3s' }}
                                                    placeholder="輸入說明文字..."
                                                    disabled={isGenerating[item.id]}
                                                />
                                                <div className="absolute bottom-0 left-3 text-[10px] text-gray-300 no-print select-none mb-0.5">
                                                    <span className={item.caption.length >= 18 ? 'text-amber-500 font-bold' : ''}>
                                                        {item.caption.length}
                                                    </span>/18
                                                </div>
                                                {item.image && (
                                                    <button
                                                        onClick={() => regenerateCaption(item.id)}
                                                        disabled={isGenerating[item.id]}
                                                        className={`no-print absolute top-1/2 -translate-y-1/2 right-2 p-1.5 rounded-full transition-all flex items-center justify-center ${
                                                            isGenerating[item.id] 
                                                            ? 'bg-blue-100 text-blue-600 cursor-not-allowed' 
                                                            : 'bg-blue-50 text-blue-500 hover:bg-blue-100 hover:scale-110 active:scale-95 shadow-sm border border-blue-100'
                                                        }`}
                                                        title="重新讓 AI 分析此照片並生成圖說"
                                                    >
                                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={isGenerating[item.id] ? 'animate-spin' : ''}>
                                                            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
                                                            <path d="M21 3v5h-5"/>
                                                        </svg>
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                
                                {/* Footer Decor */}
                                <div className="mt-4 flex justify-center items-center gap-2 opacity-60">
                                    <div className="h-1 w-20 rounded-full bg-gray-200"></div>
                                    <Dorayaki size={16} color="#B45309" />
                                    <div className="h-1 w-20 rounded-full bg-gray-200"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
